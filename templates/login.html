<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcova Homes - Admin Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #c1d0e7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: #ffffff; padding: 36px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { color: #075e54; margin-bottom: 8px; font-size: 22px; text-align: center; }
        p.subtitle { font-size: 13px; color: #666; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #333; }
        input[type="text"], input[type="password"] { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #075e54; }
        .btn-login { width: 100%; padding: 12px; background: #075e54; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s ease; }
        .btn-login:hover { background: #128c7e; }
        .flash-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Arcova Whatsup Portal</h2>
        <p class="subtitle">Please sign in with your admin credentials</p>

        {% with messages = get_flashed_messages(category_filter=["login_error"]) %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash-error">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Admin ID</label>
                <input type="text" id="username" name="username" required placeholder="Enter username" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

</body>
</html>
